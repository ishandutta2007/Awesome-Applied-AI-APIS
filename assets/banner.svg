<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="purpleCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>

  <!-- Radial Background Light -->
  <circle cx="600" cy="200" r="450" fill="url(#centerGlow)"/>

  <!-- Grid Lines (Subtle Background) -->
  <g stroke="#1e293b" stroke-width="1" stroke-opacity="0.4">
    <path d="M0 50 H1200 M0 100 H1200 M0 150 H1200 M0 200 H1200 M0 250 H1200 M0 300 H1200 M0 350 H1200" />
    <path d="M100 0 V400 M200 0 V400 M300 0 V400 M400 0 V400 M500 0 V400 M600 0 V400 M700 0 V400 M800 0 V400 M900 0 V400 M1000 0 V400 M1100 0 V400" />
  </g>

  <!-- Dynamic / Animated Background Orbits & Pulsing Nodes -->
  <g opacity="0.6">
    <!-- Animated Glowing Orbit 1 -->
    <circle cx="200" cy="200" r="120" stroke="url(#purpleCyan)" stroke-width="1.5" fill="none" stroke-dasharray="8 12">
      <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="25s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated Glowing Orbit 2 -->
    <circle cx="1000" cy="200" r="140" stroke="url(#purpleCyan)" stroke-width="1.5" fill="none" stroke-dasharray="12 16">
      <animateTransform attributeName="transform" type="rotate" from="360 1000 200" to="0 1000 200" dur="30s" repeatCount="indefinite"/>
    </circle>

    <!-- Floating Glowing Particles -->
    <circle cx="150" cy="120" r="4" fill="#06b6d4" filter="url(#glow)">
      <animate attributeName="cy" values="120;100;120" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="280" r="5" fill="#ec4899" filter="url(#glow)">
      <animate attributeName="cy" values="280;300;280" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="300" r="3" fill="#8b5cf6" filter="url(#glow)">
      <animate attributeName="cx" values="280;295;280" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="920" cy="100" r="4" fill="#3b82f6" filter="url(#glow)">
      <animate attributeName="cy" values="100;115;100" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Decorative Category Badges / Pills (Dynamic Animated Floating) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">
    <!-- Pill 1: SaaS APIs -->
    <g transform="translate(140, 75)">
      <rect x="0" y="0" width="130" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
      <text x="65" y="21" fill="#c7d2fe" text-anchor="middle">☁️ SaaS AI APIs</text>
      <animateTransform attributeName="transform" type="translate" values="140,75; 140,70; 140,75" dur="4s" repeatCount="indefinite"/>
    </g>

    <!-- Pill 2: Open Source Serving -->
    <g transform="translate(930, 75)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#064e3b" stroke="#10b981" stroke-width="1.5" opacity="0.9"/>
      <text x="75" y="21" fill="#a7f3d0" text-anchor="middle">⚡ vLLM &amp; Serving</text>
      <animateTransform attributeName="transform" type="translate" values="930,75; 930,80; 930,75" dur="4.5s" repeatCount="indefinite"/>
    </g>

    <!-- Pill 3: Speech & Vision -->
    <g transform="translate(130, 290)">
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#831843" stroke="#f43f5e" stroke-width="1.5" opacity="0.9"/>
      <text x="75" y="21" fill="#fecdd3" text-anchor="middle">🎙️ Speech &amp; Vision</text>
      <animateTransform attributeName="transform" type="translate" values="130,290; 130,295; 130,290" dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Pill 4: Multimodal LLMs -->
    <g transform="translate(920, 290)">
      <rect x="0" y="0" width="160" height="32" rx="16" fill="#312e81" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
      <text x="80" y="21" fill="#e0e7ff" text-anchor="middle">🤖 Multimodal LLMs</text>
      <animateTransform attributeName="transform" type="translate" values="920,290; 920,285; 920,290" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Central Foreground Content (PROMINENT & HIGH CONTRAST - NEVER HIDDEN) -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

    <!-- Top Badge / Header Line -->
    <g transform="translate(600, 105)">
      <rect x="-140" y="-15" width="280" height="30" rx="15" fill="url(#blueGlow)" stroke="#60a5fa" stroke-width="1"/>
      <text x="0" y="5" fill="#93c5fd" font-size="12" font-weight="700" letter-spacing="2.5" text-anchor="middle">PRODUCTION AI APIS &amp; SERVING</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="185" font-size="46" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5" filter="url(#textGlow)">
      Awesome Applied AI APIs
    </text>

    <!-- Subtitle Decorative Line -->
    <rect x="420" y="210" width="360" height="3" rx="1.5" fill="url(#purpleCyan)"/>

    <!-- Subtitle -->
    <text x="600" y="248" font-size="17" font-weight="500" fill="#cbd5e1" text-anchor="middle" letter-spacing="0.2">
      Curated Commercial AI Platforms, Pre-Trained Inference APIs &amp; Open-Source Serving Frameworks
    </text>

    <!-- Lower Meta Features Tagline -->
    <g font-size="13" font-weight="600" fill="#94a3b8">
      <text x="600" y="325" text-anchor="middle">
        <tspan fill="#38bdf8">LLM Serving</tspan> • 
        <tspan fill="#a7f3d0">Speech Recognition</tspan> • 
        <tspan fill="#f472b6">Text-to-Speech</tspan> • 
        <tspan fill="#c084fc">Computer Vision</tspan> • 
        <tspan fill="#fbbf24">Self-Hosted</tspan>
      </text>
    </g>

  </g>
</svg>
